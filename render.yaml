services:
  - type: web
    name: keyquiz-api
    runtime: python
    plan: standard
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: keyquiz-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CHROMA_DB_PATH
        value: /var/data/keyquiz/chroma
      - key: HF_HOME
        value: /var/data/keyquiz/huggingface
